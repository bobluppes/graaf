name: Documentation and Benchmarks

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            perf:
              - 'include/**'
              - 'perf/**'
              - 'CMakeLists.txt'
              - '.github/workflows/documentation.yml'

  benchmark:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Datasets rarely change, so this is keyed on the CMakeLists.txt that
      # declares their download URLs, to avoid re-downloading ~40MB from
      # Stanford SNAP on every run.
      - name: Cache perf datasets
        uses: actions/cache@v4
        with:
          path: .cache/perf_datasets
          key: perf-datasets-${{ hashFiles('perf/CMakeLists.txt') }}

      - name: Configure CMake
        # Release build for representative numbers. Examples and tests are
        # skipped since only the Graaf_perf target is needed here.
        # GRAAF_DOWNLOAD_PERF_DATASETS is on so the full benchmark suite -
        # including the dataset-backed benchmarks - actually runs.
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DSKIP_EXAMPLES=ON -DSKIP_TESTS=ON -DGRAAF_DOWNLOAD_PERF_DATASETS=ON

      - name: Build benchmarks
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --target Graaf_perf -j

      - name: Run benchmarks
        working-directory: ${{github.workspace}}/build
        run: ./perf/Graaf_perf --benchmark_out=raw_result.json --benchmark_out_format=json

      - name: Strip BigO/RMS complexity aggregate entries
        # bron_kerbosch_benchmark.cpp registers ->Complexity(), which adds
        # BigOAggregate/RMSAggregate rows alongside the normal per-run
        # timings. Those aren't per-run timings, so they aren't something we
        # want tracked as a benchmark result over time.
        working-directory: ${{github.workspace}}/build
        run: |
          jq '.benchmarks |= map(select(.run_type == "iteration"))' \
            raw_result.json > benchmark_result.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1.22.1
        with:
          tool: 'googlecpp'
          output-file-path: build/benchmark_result.json
          gh-pages-branch: benchmark-data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

  documentation:
    needs: [changes, benchmark]
    # Always deploy the docs site, whether the benchmark job ran, was
    # skipped (this push didn't touch perf-relevant paths), or even failed -
    # a benchmark regression or a flaky dataset download shouldn't hold the
    # documentation site hostage. If benchmark did run and fail, this job
    # still succeeds, but the workflow RUN as a whole is still reported as
    # failed (GitHub marks the overall run's conclusion as a failure if any
    # job in it failed, regardless of what a later if-always() job does) -
    # so a benchmark failure remains clearly visible without blocking docs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Graaf repository
        uses: actions/checkout@v7

      - name: Install mdBook
        uses: ./.github/actions/setup-mdbook

      - name: Build mdBook website
        working-directory: docs
        run: mdbook build

      # Stitches in the benchmark chart generated by the benchmark job (or,
      # if it was skipped/failed this run, whatever the last successful run
      # produced) as a subpath of the docs site, since gh-pages only
      # supports a single published source and is already the docs' site.
      - name: Checkout benchmark data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: benchmark-data
          path: benchmark-data

      - name: Merge benchmark chart into the docs site
        run: |
          if [ -d benchmark-data/dev/bench ]; then
            mkdir -p docs/book/benchmarks
            cp -r benchmark-data/dev/bench/. docs/book/benchmarks/
          else
            echo "No benchmark-data/dev/bench found; publishing docs without a benchmark chart."
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: docs/book
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
